<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />

    <!-- Title & SEO Meta -->
    <title>E-Mart — Multi-Vendor Marketplace & Delivery Platform</title>
    <meta
      name="description"
      content="E-Mart is an all-in-one multi-vendor marketplace connecting customers, vendors, and delivery partners for fast, seamless shopping."
    />
    <meta
      name="keywords"
      content="e-mart, marketplace, online grocery, multi-vendor, vendor dashboard, fast delivery, ecommerce"
    />
    <meta name="author" content="E-Mart" />
    <meta name="theme-color" content="#ea580c" />
    <meta name="robots" content="index, follow" />

    <!-- Favicon & Touch Icons -->
    <link rel="icon" type="image/png" href="/logo.png" />
    <link rel="apple-touch-icon" href="/logo.png" />

    <!-- Open Graph / Facebook / WhatsApp -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="E-Mart" />
    <meta property="og:title" content="E-Mart — Multi-Vendor Marketplace & Delivery Platform" />
    <meta
      property="og:description"
      content="Manage your store, track live orders, inspect sales analytics, and grow your business with E-Mart."
    />
    <meta property="og:image" content="/logo.png" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="E-Mart — Multi-Vendor Marketplace & Delivery Platform" />
    <meta
      name="twitter:description"
      content="Manage your store, track live orders, inspect sales analytics, and grow your business with E-Mart."
    />
    <meta name="twitter:image" content="/logo.png" />

    <!-- Google Fonts Preconnect & Stylesheet -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body class="antialiased selection:bg-orange-500 selection:text-white">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
